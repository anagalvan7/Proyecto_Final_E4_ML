# Book settings
title: "Clasificación de la cobertura forestal (Covertype)"
author: "Ana Galván, Valeria Oñate y María José Ruiz"
copyright: "2026"
logo: logo_bosque.jpg

execute:
  execute_notebooks: cache
  timeout: 3600
  allow_errors: false

only_build_toc_files: true

latex:
  latex_documents:
    targetname: covertype_ml.tex

bibtex_bibfiles:
  - references.bib

html:
  use_issues_button: false
  use_repository_button: false
  use_edit_page_button: false
  extra_navbar: ""

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence

sphinx:
  config:
    language: es
    nb_output_stderr: remove
    nb_code_prompt_show: "Mostrar código"
    nb_code_prompt_hide: "Ocultar código"
    bibtex_reference_style: author_year
    html_static_path:
      - _static
    html_css_files:
      - custom.css
